<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Library - Add New Review</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <a href="../index.html" class="logo">
            <img src="../assets/images/mlib-icon.svg" alt="MLib logo" height="32">
            <span>MLib</span>
        </a>

        <nav>
            <a href="add-review.html" class="add-button" aria-label="Add new movie review">+</a>
        </nav>
    </header>

    <main>
        <div class="form-page-container">
            <h1>New Review</h1>

            <div class="form-container">
                <p class="form-note">This is a demo: the review is not saved and no card is added.</p>

                <form action="add-review.html" method="get">
                    <div class="form-group">
                        <label for="movie-name">Movie Name</label>
                        <input type="text" id="movie-name" name="movie-name" placeholder="Enter the movie title" required>
                    </div>

                    <div class="form-group">
                        <label for="poster-url">Poster URL</label>
                        <input type="url" id="poster-url" name="poster-url" placeholder="Paste image URL (jpg or png)">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="rating-select">Stars</label>
                            <select id="rating-select" name="rating" required>
                                <option value="">Choose a rating</option>
                                <option value="1">★☆☆☆☆ - 1 Star</option>
                                <option value="2">★★☆☆☆ - 2 Stars</option>
                                <option value="3">★★★☆☆ - 3 Stars</option>
                                <option value="4">★★★★☆ - 4 Stars</option>
                                <option value="5">★★★★★ - 5 Stars</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="watched-date">Watched Date</label>
                            <input type="date" id="watched-date" name="watched-date">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="review-text">My Review</label>
                        <textarea id="review-text" name="review" rows="5" placeholder="Write your thoughts here..." required></textarea>
                    </div>

                    <button type="submit" class="submit-button">Add</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 MLib &ndash; My Movie Library</p>
    </footer>
</body>

</html>
