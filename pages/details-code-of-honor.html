<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Library - Code of Honor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <a href="../index.html" class="logo">
            <img src="../assets/images/mlib-icon.svg" alt="MLib logo" height="32">
            <span>MLib</span>
        </a>

        <nav>
            <a href="add-review.html" class="add-button" aria-label="Add new movie review"><span class="material-symbols-outlined" aria-hidden="true">add</span></a>
        </nav>
    </header>

    <main>
        <div class="movie-details-container">
            <div class="back-link">
                <a href="../index.html"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Back to List</a>
            </div>

            <div class="movie-details-body">
                <div class="movie-poster">
                    <img src="../assets/images/code-of-honor-poster.png" alt="Poster for Code of Honor">
                </div>

                <div class="movie-details-info">
                    <h1 class="movie-title">Code of Honor</h1>

                    <div class="movie-section">
                        <p><strong>Watched on:</strong> 02/10/2025</p>
                    </div>

                    <div class="movie-section rating-details">
                        <p><strong>Rating:</strong></p>
                        <div class="rating" role="img" aria-label="4 out of 5 stars">
                            <span>★</span>
                            <span>★</span>
                            <span>★</span>
                            <span>★</span>
                            <span class="star-empty">★</span>
                        </div>
                        <p class="rating-text">(4/5)</p>
                    </div>

                    <div class="movie-section">
                        <p class="review-title"><strong>Review:</strong></p>
                        <p>An exemplary tale of programming virtue and determination. The plot twists were as unexpected as a segmentation fault. A must-watch for every developer.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 MLib &ndash; My Movie Library</p>
    </footer>
</body>

</html>
