<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: links</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Página inicial</h1>

    <nav>
        <!-- 1. link para outra página (caminho relativo: entra na pasta pages) -->
        <a href="pages/about.html">Sobre</a>

        <!-- 2. link para uma seção desta página (# + id) -->
        <a href="#contact">Ir para Contato</a>

        <!-- 3. link externo, abrindo em nova aba -->
        <a href="https://neps.academy" target="_blank" rel="noopener">Neps Academy (nova aba)</a>
    </nav>

    <section id="home">
        <h2>Início</h2>
        <p>Role a página ou clique em "Ir para Contato".</p>
    </section>

    <section id="contact">
        <h2>Contato</h2>
        <p>Chegamos aqui pelo link com <code>href="#contact"</code>.</p>
        <a href="#home">Voltar ao topo</a>
    </section>
</body>

</html>
