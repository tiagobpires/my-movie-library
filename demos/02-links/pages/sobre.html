<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: links - Sobre</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; line-height: 1.6; padding: 0 16px; }
    </style>
</head>

<body>
    <h1>Sobre</h1>

    <p>Este arquivo está dentro da pasta <code>pages/</code>.</p>
    <p>Para voltar, o link precisa <strong>subir uma pasta</strong> com <code>../</code>:</p>

    <ul>
        <li><a href="../index.html">Voltar para a página inicial</a> (<code>../index.html</code>)</li>
        <li><a href="../index.html#contato">Ir direto para o Contato da inicial</a> (<code>../index.html#contato</code>)</li>
        <li><a href="index.html">Link quebrado</a> (<code>index.html</code>: procura dentro de <code>pages/</code> e não acha)</li>
    </ul>
</body>

</html>
