<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: formulários</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Inscrição no clube de cinema</h1>

    <!-- Abra com o Live Preview (endereço http://) e envie: os dados aparecem na URL -->
    <form action="index.html" method="get">

        <div class="field">
            <!-- for do label = id do input -->
            <label for="name">Nome *</label>
            <input type="text" id="name" name="name" placeholder="Ex.: Ana" required>
        </div>

        <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="ana@email.com">
        </div>

        <div class="field">
            <label for="age">Idade</label>
            <input type="number" id="age" name="age" min="10" max="99">
        </div>

        <div class="field">
            <label for="last-movie-date">Data do último filme que viu</label>
            <input type="date" id="last-movie-date" name="last-movie-date">
        </div>

        <div class="field">
            <label for="genre">Gênero favorito *</label>
            <select id="genre" name="genre" required>
                <option value="">Escolha um gênero</option>
                <option value="action">Ação</option>
                <option value="comedy">Comédia</option>
                <option value="sci-fi">Ficção científica</option>
            </select>
        </div>

        <div class="field">
            <label for="reason">Por que quer participar?</label>
            <textarea id="reason" name="reason" rows="4"></textarea>
        </div>

        <div class="field">
            <label>
                <input type="checkbox" name="newsletter" value="yes">
                Quero receber novidades
            </label>
        </div>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
