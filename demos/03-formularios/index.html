<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: formulários</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
        .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
        input, select, textarea { padding: 8px; font-family: inherit; }
    </style>
</head>

<body>
    <h1>Inscrição no clube de cinema</h1>

    <!-- Abra com o Live Preview (endereço http://) e envie: os dados aparecem na URL -->
    <form action="index.html" method="get">

        <div class="campo">
            <!-- for do label = id do input -->
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Ana" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="ana@email.com">
        </div>

        <div class="campo">
            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" min="10" max="99">
        </div>

        <div class="campo">
            <label for="data">Data do último filme que viu</label>
            <input type="date" id="data" name="data">
        </div>

        <div class="campo">
            <label for="genero">Gênero favorito *</label>
            <select id="genero" name="genero" required>
                <option value="">Escolha um gênero</option>
                <option value="acao">Ação</option>
                <option value="comedia">Comédia</option>
                <option value="ficcao">Ficção científica</option>
            </select>
        </div>

        <div class="campo">
            <label for="motivo">Por que quer participar?</label>
            <textarea id="motivo" name="motivo" rows="4"></textarea>
        </div>

        <div class="campo">
            <label>
                <input type="checkbox" name="novidades" value="sim">
                Quero receber novidades
            </label>
        </div>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
