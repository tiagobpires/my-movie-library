<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- sem esta linha, o celular finge ser uma tela larga e "diminui" o site -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: responsivo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <p class="fixed">padding: 182px nas laterais: aperta no celular</p>
    <p class="relative">padding: 5% nas laterais: acompanha a tela</p>

    <p class="relative">Agora você está vendo: <strong class="screen-label"></strong></p>

    <div class="boxes">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>

</html>
