<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- sem esta linha, o celular finge ser uma tela larga e "diminui" o site -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: responsivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { font-family: Arial, sans-serif; }

        /* 1. padding fixo vs. padding em % (diminua a janela) */
        .fixo { background: #FFC9C9; padding: 20px 182px; }
        .relativo { background: #B2F2BB; padding: 20px 5%; }

        /* 2. caixas lado a lado */
        .caixas { display: flex; gap: 16px; padding: 24px 5%; }
        .caixa { flex: 1; height: 120px; border-radius: 12px; background: #A5D8FF; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        .aviso::after { content: "🖥️ tela larga"; }

        /* 3. Media query: só vale em telas de até 540px */
        @media (max-width: 540px) {
            .caixas { flex-direction: column; }
            .caixa { background: #FFEC99; flex: none; }
            .aviso::after { content: "📱 tela de celular"; }
        }
    </style>
</head>

<body>
    <p class="fixo">padding: 182px nas laterais: aperta no celular</p>
    <p class="relativo">padding: 5% nas laterais: acompanha a tela</p>

    <p class="relativo">Agora você está vendo: <strong class="aviso"></strong></p>

    <div class="caixas">
        <div class="caixa">1</div>
        <div class="caixa">2</div>
        <div class="caixa">3</div>
    </div>
</body>

</html>
