<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: ícones</title>
    <!-- Material Symbols: uma fonte em que cada "palavra" vira um ícone -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="icons.css">
</head>

<body>
    <h1>Ícones com Material Symbols</h1>
    <p>Busque o nome do ícone em <a href="https://fonts.google.com/icons" target="_blank" rel="noopener">fonts.google.com/icons</a>.</p>

    <div class="row">
        <span class="material-symbols-outlined">add</span>
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="material-symbols-outlined">star</span>
        <span class="material-symbols-outlined">movie</span>
        <span class="material-symbols-outlined">favorite</span>
    </div>

    <!-- é texto: muda de tamanho e cor com CSS -->
    <div class="row">
        <span class="material-symbols-outlined big">movie</span>
        <span class="material-symbols-outlined big">local_activity</span>
    </div>

    <!-- dentro de um link -->
    <p><a href="#"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Back to List</a></p>
</body>

</html>
