<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: animações</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Interação e animação</h1>

    <h2>1 e 2. :hover sem e com transition</h2>
    <div class="row">
        <button class="no-transition">Sem transition</button>
        <button class="with-transition">Com transition</button>
    </div>

    <h2>3. Funções de tempo (passe o mouse na pista)</h2>
    <div class="track">
        <div class="ball ease">ease</div>
        <div class="ball linear">linear</div>
        <div class="ball ease-in">ease-in</div>
        <div class="ball ease-out">ease-out</div>
    </div>

    <h2>4. transform no hover</h2>
    <div class="row">
        <div class="box scale">scale</div>
        <div class="box rotate">rotate</div>
        <div class="box translate">translate</div>
    </div>

    <h2>5. @keyframes (recarregue a página)</h2>
    <div class="row">
        <div class="box fade-in">1</div>
        <div class="box fade-in">2</div>
        <div class="box fade-in">3</div>
        <button class="pulsing">Pulsando</button>
    </div>
</body>

</html>
